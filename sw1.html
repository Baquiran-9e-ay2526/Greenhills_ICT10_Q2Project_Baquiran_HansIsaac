<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Club Member Checker</title>
</head>
<body class="py-4">

    <nav class="navbar navbar-expand-lg navbar-dark px-4 mb-5 rounded">
        <a class="navbar-brand fw-bold" href="project.html">Student Showcase 2026</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="sw1.html">1. Club Checker (SW1)</a>
            <a class="nav-link" href="skillstest.html">2. Element Checker</a>
            <a class="nav-link" href="drill2.html">3. Cadet Corps (Drill 2)</a>
            <a class="nav-link" href="project.html">4. Meet the Creator</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <div class="card p-4 rounded-4 shadow-lg">
            <div class="card-body">
                <h2 class="text-info text-center fw-bold mb-2">Candidate Verification</h2>
                <p class="text-muted text-center small mb-4">Seatwork 1 - Check COCC club membership eligibility.</p>
                
                <form>
                    <div class="mb-3">
                        <label for="student_name" class="form-label text-warning small fw-bold">First Name:</label>
                        <input type="text" id="student_name" class="form-control" placeholder="Enter your First Name">
                    </div>
                    <div class="mb-3">
                        <label for="surname" class="form-label text-warning small fw-bold">Last Name:</label>
                        <input type="text" id="surname" class="form-control" placeholder="Enter your Last Name">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="button" id="submit-btn" class="btn btn-primary py-2 fw-bold">Verify Status</button>
                    </div>
                </form>

                <div id="output" class="mt-4 text-center"></div>
            </div>
        </div>
    </div>

    <py-script src="sw1.py"></py-script>
</body>
</html>
