<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <title>Non-Metal Elements</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h2 class="mb-1">Non-Metal Elements</h2>
                <p class="mb-0 small">Periodic Table Information Finder</p>
            </div>
            
    <div class="card-body p-4">
        <div class="alert alert-info border-0 mb-4">
            <strong>Instructions:</strong><br>
                Enter the symbol of a non-metal element (Example: Kr, Ar, O, Ne, Xe).
        </div>

    <div class="mb-3">
        <label for="symbol-input" class="form-label fw-bold">Enter Element Symbol:</label>
        <input type="text" id="symbol-input" class="form-control" placeholder="Exe: H, He, O">
    </div>

    <div class="d-grid mb-4">
        <button id="search-btn" class="btn btn-success btn-lg">Find Element:</button>
    </div>

        <div id="result-output"></div>

    
    <py-script src="skillstest.py"></py-script>
</body>
</html>
